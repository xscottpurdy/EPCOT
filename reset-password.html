<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    EPCOT // Reset Password
  </title>


  <style>

    *{
      box-sizing:border-box;
    }

    body{

      min-height:100vh;

      margin:0;

      display:grid;

      place-items:center;

      padding:24px;

      color:#ded8c7;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(50,182,205,.14),
          transparent 42%
        ),
        #020a0f;

      font-family:
        "Avenir Next",
        "Trebuchet MS",
        Arial,
        sans-serif;

    }


    .reset-shell{

      width:min(
        520px,
        100%
      );

      padding:28px;

      border:
        1px solid
        rgba(50,182,205,.3);

      background:
        #061720;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.45);

    }


    .reset-kicker{

      color:#32b6cd;

      font-size:11px;

      font-weight:900;

      letter-spacing:.12em;

      text-transform:uppercase;

    }


    h1{

      margin:
        7px 0
        8px;

      color:#efc86d;

      font-size:27px;

    }


    .reset-copy{

      margin:
        0 0
        22px;

      color:#8ca3a8;

      font-size:14px;

      line-height:1.55;

    }


    .reset-field{

      display:grid;

      gap:7px;

      margin-top:14px;

    }


    .reset-field span{

      color:#9badb0;

      font-size:12px;

      font-weight:800;

      letter-spacing:.06em;

      text-transform:uppercase;

    }


    .reset-field input{

      width:100%;

      min-height:46px;

      padding:
        0
        12px;

      border:
        1px solid
        rgba(50,182,205,.28);

      background:#031118;

      color:#ded8c7;

      font:inherit;

      font-size:15px;

      outline:none;

    }


    .reset-field input:focus{

      border-color:#d6a64b;

    }


    .reset-button{

      width:100%;

      min-height:46px;

      margin-top:20px;

      border:
        1px solid
        rgba(214,166,75,.5);

      background:
        rgba(214,166,75,.1);

      color:#efc86d;

      font:inherit;

      font-size:13px;

      font-weight:900;

      letter-spacing:.07em;

      text-transform:uppercase;

      cursor:pointer;

    }


    .reset-button:disabled{

      opacity:.5;

      cursor:wait;

    }


    .reset-status{

      margin-top:16px;

      padding:11px;

      border:
        1px solid
        rgba(255,255,255,.08);

      color:#aebbbc;

      font-size:13px;

      line-height:1.5;

    }


    .reset-status.error{

      color:#e6a19c;

      border-color:
        rgba(210,79,67,.35);

    }


    .reset-status.success{

      color:#83d8a4;

      border-color:
        rgba(100,216,155,.35);

    }

  </style>

</head>


<body>


  <main class="reset-shell">


    <div class="reset-kicker">
      VistaCorp Identity Services
    </div>


    <h1>
      Reset Password
    </h1>


    <p class="reset-copy">

      Enter a new password for your EPCOT account.

    </p>


    <label class="reset-field">

      <span>
        New Password
      </span>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
      >

    </label>


    <label class="reset-field">

      <span>
        Confirm New Password
      </span>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
      >

    </label>


    <button
      id="resetButton"
      class="reset-button"
      type="button"
    >
      Update Password
    </button>


    <div
      id="resetStatus"
      class="reset-status"
    >
      Verifying recovery session...
    </div>


  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script>

    /* =================================================
       SUPABASE
       ================================================= */

    const supabaseClient =
      window.supabase.createClient(

        'https://yuufbisyzjqnsdbwzzgw.supabase.co',

        'sb_publishable_4dShwxduft6rGco67emZCw_EQLn8nQc',

        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }

      );


    const passwordInput =
      document.getElementById(
        'newPassword'
      );


    const confirmInput =
      document.getElementById(
        'confirmPassword'
      );


    const button =
      document.getElementById(
        'resetButton'
      );


    const status =
      document.getElementById(
        'resetStatus'
      );


    function setStatus(
      message,
      type = ''
    ){

      status.textContent =
        message;


      status.className =
        `reset-status ${type}`;

    }


    /* =================================================
       DETECT RECOVERY SESSION
       ================================================= */

    supabaseClient.auth.onAuthStateChange(
      (
        event,
        session
      ) => {

        console.log(
          'Password recovery auth event:',
          event
        );


        if(
          event ===
          'PASSWORD_RECOVERY'
        ){

          setStatus(
            'Recovery link verified. Enter your new password.',
            'success'
          );

          return;

        }


        if(
          session
        ){

          setStatus(
            'Account verified. Enter your new password.',
            'success'
          );

        }

      }
    );


    /* =================================================
       INITIAL SESSION CHECK
       ================================================= */

    async function checkRecoverySession(){

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if(error){

        setStatus(
          error.message,
          'error'
        );

        return;

      }


      if(
        data.session
      ){

        setStatus(
          'Account verified. Enter your new password.',
          'success'
        );

      }
      else{

        setStatus(
          'No password recovery session was found. Request a new recovery email and use the newest link.',
          'error'
        );

      }

    }


    /* =================================================
       UPDATE PASSWORD
       ================================================= */

    button.addEventListener(
      'click',
      async () => {

        const password =
          passwordInput.value;


        const confirmation =
          confirmInput.value;


        if(
          password.length < 8
        ){

          setStatus(
            'Password must contain at least 8 characters.',
            'error'
          );

          return;

        }


        if(
          password !==
          confirmation
        ){

          setStatus(
            'The passwords do not match.',
            'error'
          );

          return;

        }


        button.disabled =
          true;


        button.textContent =
          'Updating...';


        const {
          error
        } =
          await supabaseClient.auth.updateUser({

            password

          });


        if(error){

          console.error(
            'Password update failed:',
            error
          );


          setStatus(
            error.message,
            'error'
          );


          button.disabled =
            false;


          button.textContent =
            'Update Password';


          return;

        }


        setStatus(
          'Password updated successfully. Returning to EPCOT...',
          'success'
        );


        window.setTimeout(
          () => {

            window.location.href =
              'index.html';

          },
          1500
        );

      }
    );


    checkRecoverySession();

  </script>


</body>

</html>
